/* ============================================================
   ちとせの日常 — 画面は 360×640 の論理座標で描く
   ============================================================ */
const W = 360, H = 640, DPR = 2;
const cv = document.getElementById("cv");
const g = cv.getContext("2d");
cv.width = W * DPR; cv.height = H * DPR;
g.scale(DPR, DPR);
g.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
addEventListener("resize", fit); fit();

function load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stats) return s; } catch (e) {} return freshSave(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

    if (eyes === "sleep") return `<path d="M${x - 6},-3 Q${x},3 ${x + 6},-3" fill="none" stroke="${K.pu}" stroke-width="2.8" stroke-linecap="round"/>`;

function hexes(s) { return [...new Set(s.match(/#[0-9a-fA-F]{6}/g))].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]); }
function pixelate(sp, targetH) {
  return new Promise((res, rej) => {
    const [x, y, w, h] = sp.vb, H2 = targetH, W2 = Math.round(w * targetH / h);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${W2}" height="${H2}">${sp.svg}</svg>`;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = W2 + 2; c.height = H2 + 2;
      const cg = c.getContext("2d"); cg.drawImage(img, 1, 1, W2, H2);
      const d = cg.getImageData(0, 0, c.width, c.height), a = d.data, pal = hexes(sp.svg), n = c.width * c.height, on = new Uint8Array(n);
      for (let i = 0; i < n; i++) {
        const k = i * 4; if (a[k + 3] < 110) { a[k + 3] = 0; continue; }
        const r = a[k] / a[k + 3] * 255, gg = a[k + 1] / a[k + 3] * 255, b = a[k + 2] / a[k + 3] * 255;
        let best = pal[0], bd = 1e9;
        for (const p of pal) { const dd = (p[0] - r) ** 2 + (p[1] - gg) ** 2 + (p[2] - b) ** 2; if (dd < bd) { bd = dd; best = p; } }
        a[k] = best[0]; a[k + 1] = best[1]; a[k + 2] = best[2]; a[k + 3] = 255; on[i] = 1;
      }
      for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++) {
        const i = yy * c.width + xx; if (on[i]) continue;
        if ((xx > 0 && on[i - 1]) || (xx < c.width - 1 && on[i + 1]) || (yy > 0 && on[i - c.width]) || (yy < c.height - 1 && on[i + c.width])) {
          const k = i * 4; a[k] = 0x3b; a[k + 1] = 0x32; a[k + 2] = 0x2d; a[k + 3] = 255;
        }
      }
      cg.putImageData(d, 0, 0); res(c);
    };
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

let scene = null;
function go(s) { scene = s; s.enter && s.enter(); }

class Scene {
  constructor() { this.t = 0; this.dlg = null; this.fx = []; this.btns = []; this.held = {}; this.shake = 0; }
  say(lines, cb) { this.dlg = { lines, i: 0, cb, t: 0 }; this.held = {}; }
  btn(id, x, y, w, h, label, o = {}) { this.btns.push({ id, x, y, w, h, label, ...o }); }
  _update(dt) {
    this.t += dt; updFx(this.fx, dt); if (this.shake > 0) this.shake -= dt;
    if (this.dlg) { this.dlg.t += dt; this.idle && this.idle(dt); return; }
    this.update && this.update(dt);
  }
  _draw() {
    g.save();
    if (this.shake > 0) g.translate(Math.round(Math.sin(this.t * 60) * 3), 0);
    this.draw();
    drawFx(this.fx);
    g.restore();
    if (!this.dlg) { this.hud && this.hud(); this.drawBtns(); }
    else drawDialog(this.dlg);
  }
  drawBtns() {
    for (const b of this.btns) {
      if (b.hidden && b.hidden()) continue;
      const down = this.held[b.id] || (b.flash && this.t - b.flash < .12);
      const y = b.y + (down ? 3 : 0);
      if (!down) rr(b.x, b.y + 5, b.w, b.h, 16, "#b36a7c");
      rr(b.x, y, b.w, b.h, 16, down ? "#f4a6b9" : (b.color || "#fbd3dd"), OUTLINE, 3);
      text(b.label, b.x + b.w / 2, y + b.h / 2 - (b.sub ? 7 : 0), { size: b.size || 20 });
      if (b.sub) text(b.sub, b.x + b.w / 2, y + b.h / 2 + 15, { size: 11, color: "#7a5a60", weight: "bold" });
    }
  }
  _down(x, y) {
    if (this.dlg) return;
    for (const b of this.btns) {
      if (b.hidden && b.hidden()) continue;
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h + 5) {
        this.held[b.id] = true; b.flash = this.t; this.press && this.press(b.id); return;
      }
    }
    this.tap && this.tap(x, y);
  }
  _up(x, y) {
    if (this.dlg) {
      if (this.dlg.t < .18) return;
      this.dlg.i++; this.dlg.t = 0;
      if (this.dlg.i >= this.dlg.lines.length) { const cb = this.dlg.cb; this.dlg = null; cb && cb(); }
      return;
    }
    for (const id in this.held) if (this.held[id]) { this.held[id] = false; this.release && this.release(id); }
  }
}

/* ============================================================
   ミッション6 おでかけを阻止せよ
   ============================================================ */
class M6 extends Scene {
  constructor() {
    super();
    this.phase = "wait"; this.love = 0; this.who = 0; this.handY = -130; this.hesoT = 0; this.cool = 0; this.state = "idle"; this.stT = 1.2; this.catX = 180; this.msg = null;
    this.btn("heso", 70, 548, 220, 72, "へそ天！", { size: 24, hidden: () => this.phase !== "play" });
    this.say([
      ["", "夕方5時。おっとと つまが 出かける準備を している。"],
      ["つま", "ちょっと 買い物 行ってくるね〜"],
      ["ちとせ", "（…ゆるさない。）"],
      ["", "ちとせは 玄関の前に 寝そべった！"],
      ["", "手が のびてきたら「へそ天！」 持ち上げられないように お腹を見せて メロメロにしよう。"],
    ], () => { this.phase = "play"; });
  }
  get owner() { return this.who % 2 === 0 ? OTTO : TSUMA; }
  press(id) {
    if (id !== "heso" || this.phase !== "play" || this.cool > 0 || this.state === "lifted" || this.state === "return") return;
    this.hesoT = 1.3; this.cool = 1.4; SAVE.stats.hesoten++;
  }
  update(dt) {
    if (this.msg) { this.msg[1] -= dt; if (this.msg[1] <= 0) this.msg = null; }
    if (this.phase !== "play") return;
    if (this.hesoT > 0) this.hesoT -= dt;
    if (this.cool > 0) this.cool -= dt;
    this.stT -= dt;
    if (this.state === "idle") { this.handY = -130; if (this.stT <= 0) { this.state = "reach"; this.speed = 170 + this.who * 25; this.msg = [this.who % 2 === 0 ? "ほら、どいて〜" : "ちとせ、ごめんね〜", 1.2]; } }
    else if (this.state === "reach") {
      this.handY += dt * this.speed;
      if (this.handY >= 400) {
        if (this.hesoT > 0) {
          this.state = "pet"; this.stT = 1.4; this.hesoT = 1.6; this.love += 1 / 3;
          this.msg = [["うっ… お腹… ふわふわ…", "か、かわいすぎる…", "もう 行けない…"][Math.min(2, this.who)], 1.6];
          for (let i = 0; i < 6; i++) fxHeart(this.fx, 180, 420);
        } else { this.state = "lifted"; this.stT = 1.0; SAVE.stats.lifted++; this.msg = ["ひょいっ", 1]; }
      }
    } else if (this.state === "pet") {
      if (Math.random() < dt * 5) fxHeart(this.fx, 180, 420);
      if (this.stT <= 0) {
        this.who++;
        if (this.love >= .99) { this.phase = "end"; this.love = 1;
          this.say([["つま", "…ねえ、今日は やっぱり 家にいようか"], ["おっと", "…だね。ちとせには 勝てないよ"], ["ちとせ", "（計画どおり。）"]], () => clearMission(6)); return; }
        this.state = "leave"; this.stT = .8;
      }
    } else if (this.state === "leave") { this.handY -= dt * 500; if (this.stT <= 0) { this.state = "idle"; this.stT = 1 + Math.random(); } }
    else if (this.state === "lifted") { this.handY -= dt * 180; this.catX = 180 - (1 - Math.max(0, this.stT)) * 130; if (this.stT <= 0) { this.state = "return"; this.stT = 1.2; this.msg = ["ちとせ ちょっと まっててね", 1.2]; } }
    else if (this.state === "return") { this.handY = -130; this.catX = Math.min(180, this.catX + dt * 110); if (this.catX >= 180) { this.state = "idle"; this.stT = 1; } }
  }
  draw() {
    genkan(17);
    spr(this.who % 2 === 0 ? S.otto : S.tsuma, 306, 600);
    const hy = this.handY;
    if (this.state === "lifted") {
      const k = 1 - Math.max(0, this.stT);
      spr(S.walk0, this.catX, 470 - Math.sin(k * Math.PI) * 90, { flip: true });
      spr(this.who % 2 === 0 ? S.handO : S.handT, this.catX + 10, hy + 20 - Math.sin(k * Math.PI) * 90 + (400 - hy) * 0);
    } else if (this.state === "return") {
      spr(Math.floor(this.t * 5) % 2 ? S.walk0 : S.walk1, this.catX, 480);
    } else {
      if (this.state === "reach") { const k = Math.max(0, (hy + 130) / 530); g.fillStyle = `rgba(59,50,45,${.1 + k * .25})`; g.beginPath(); g.ellipse(190, 478, 30 + k * 40, 6 + k * 5, 0, 0, 7); g.fill(); }
      if (this.hesoT > 0) spr(S.heso, 180 + (this.state === "pet" ? Math.sin(this.t * 14) * 2 : 0), 482);
      else spr(this.state === "reach" && hy > 250 ? S.lieJito : S.lie, 180, 482);
      if (hy > -120) spr(this.who % 2 === 0 ? S.handO : S.handT, 196 + (this.state === "pet" ? Math.sin(this.t * 12) * 10 : 0), hy + 30);
    }
    if (this.msg) bubble(this.msg[0], 306, 384);
  }
  hud() {
    hudTitle("17:00 おでかけを阻止せよ");
    gauge(40, 58, 280, this.love, "メロメロゲージ", "#f07a98");
    if (this.state === "reach" && this.handY > 250 && this.phase === "play") text("いまだ！", W / 2, 150, { size: 26, color: "#e2574c", stroke: "#fff", lw: 6 });
  }
}

/* ============================================================
   メインループ
   ============================================================ */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (scene) { scene._update(dt); g.clearRect(0, 0, W, H); scene._draw(); }
  requestAnimationFrame(frame);
}
g.fillStyle = "#f6ecdf"; g.fillRect(0, 0, W, H); text("よみこみ中…", W / 2, H / 2, { size: 18 });
loadSprites().then(() => {
  const m = location.hash.match(/^#m([1-6])$/);
  if (m) go(MISSIONS[m[1] - 1].make());
  else if (location.hash === "#end") go(new Ending());
  else go(new Title());
  requestAnimationFrame(frame);
}).catch(e => { g.fillStyle = "#f6ecdf"; g.fillRect(0, 0, W, H); text("読み込みに失敗しました", W / 2, H / 2, { size: 16 }); console.error(e); });
